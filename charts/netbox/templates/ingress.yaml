{{/*
Ingress for the NetBox web service.

The upstream chart takes its hostname as a list (`ingress.hosts[]`,
`ingress.tls[]`), and Rancher's questions.yaml cannot fill in list values
(rancher/rancher#32336). So the upstream Ingress stays disabled and this one is
built from the single `hostname` value instead.

The backend is the Service of the upstream chart, whose name is pinned through
`netbox.fullnameOverride` and whose port is called `http`.
*/}}
{{- if .Values.ingress.enabled }}
{{- $host := required "hostname is required: set it to the FQDN this instance is served on" .Values.hostname }}
{{- $service := required "netbox.fullnameOverride is required: the Ingress needs a fixed Service name" .Values.netbox.fullnameOverride }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" }}
  {{- if or .Values.ingress.certManagerIssuer .Values.ingress.annotations }}
  annotations:
    {{- with .Values.ingress.certManagerIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
  - hosts:
    - {{ $host | quote }}
    secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
  - host: {{ $host | quote }}
    http:
      paths:
      - path: {{ .Values.ingress.path | quote }}
        pathType: {{ .Values.ingress.pathType | quote }}
        backend:
          service:
            name: {{ $service | quote }}
            port:
              name: http
{{- end }}
