# Cyberlink defaults for the upstream NetBox chart.
#
# This chart wraps netbox-community/netbox-chart. Everything under the `netbox:`
# key is passed straight to the upstream chart; for the full list of available
# settings see
# https://github.com/netbox-community/netbox-chart/blob/main/charts/netbox/values.yaml
#
# On top of that this chart ships:
#   * a ConfigMap with our CustomDeviceValidator (templates/custom-validators.yaml)
#   * its own Ingress (templates/ingress.yaml), driven by the single `hostname`
#     value below, because Rancher's questions.yaml cannot fill in list values
#   * defaults that make a new instance need nothing but a hostname and the
#     PostgreSQL endpoint
#
# One instance per namespace. All credentials come from a Secret called
# `netbox-secrets` that is created once per namespace, outside of the release —
# see hack/create-netbox-secret.sh.

## Fully qualified domain name of this instance. The only place the hostname has
## to be given; the Ingress below is built from it.
hostname: ""

## Ingress rendered by this chart (the upstream one stays disabled).
ingress:
  enabled: true
  className: nginx
  ## Rendered as the cert-manager.io/cluster-issuer annotation when set.
  certManagerIssuer: ""
  ## TLS secret cert-manager writes the certificate to.
  tlsSecretName: netbox-tls
  path: /
  pathType: Prefix
  annotations: {}

netbox:
  ## Fixed object names. Our Ingress points at the Service by name, and the
  ## instance is alone in its namespace, so there is nothing to disambiguate.
  fullnameOverride: netbox

  ## We render the Ingress ourselves, see above.
  ingress:
    enabled: false

  ## PostgreSQL runs outside the cluster, so the bundled sub-chart stays off.
  ## NetBox 4.6 requires PostgreSQL 14 or newer; 15+ will be required as of 4.7.
  postgresql:
    enabled: false

  externalDatabase:
    host: ""
    port: 5432
    database: netbox
    username: netbox
    existingSecretName: netbox-secrets
    existingSecretKey: db_password
    options:
      # Set to "prefer" if the database does not offer TLS.
      sslmode: require
      target_session_attrs: read-write

  ## Valkey ships with the instance: host, port and password are wired up by the
  ## upstream chart, so nothing about it has to be configured per instance.
  valkey:
    enabled: true
    ## The Bitnami default is "replication", which would add three replica pods
    ## for what is a task queue and a cache.
    architecture: standalone
    auth:
      existingSecret: netbox-secrets
      existingSecretPasswordKey: valkey_password
      # NetBox cannot configure SENTINEL_KWARGS, so Sentinel auth stays off.
      sentinel: false
    primary:
      persistence:
        size: 2Gi
    image:
      ## Docker Hub only carries the rolling `latest` tag for bitnami/valkey
      ## since Bitnami moved the versioned tags behind Secure Images, so the
      ## image is pinned by digest. Refresh it deliberately with:
      ##   docker buildx imagetools inspect bitnami/valkey:latest
      ## Digest below is bitnami/valkey:latest as of 2026-08-11 (Valkey 9.1.1).
      digest: sha256:86dcdca047220ff2688156302ed7aa2dacd96eca7799e02b5f0a7099c95dd35d

  ## Only the database numbers are used while `valkey.enabled` is true. Set
  ## `valkey.enabled: false` and add `host`/`port`/`existingSecretName` here to
  ## point at a Valkey server outside the release.
  tasksDatabase:
    database: 0
  cachingDatabase:
    database: 1

  ## Credentials. All of these live in one hand-made Secret per namespace;
  ## see hack/create-netbox-secret.sh for the keys it has to contain.
  ##
  ## Note that `existingSecret` must also carry `email_password` — the upstream
  ## chart projects that key without `optional: true`, so a missing key leaves
  ## the pods stuck in ContainerCreating.
  existingSecret: netbox-secrets
  superuser:
    existingSecret: netbox-secrets

  ## Media (image attachments) go to S3, so the local volume is not needed. That
  ## also means the web deployment can be scaled past one replica.
  persistence:
    enabled: false

  ## Object storage. Only `bucket_name` and `endpoint_url` differ per instance;
  ## both are asked for in the Rancher form and validated in NOTES.txt.
  ## NetBox merges this over its DEFAULT_STORAGES, so `staticfiles` and
  ## `scripts` keep their defaults.
  ## Options reference:
  ## https://django-storages.readthedocs.io/en/latest/backends/amazon-S3.html
  storages:
    default:
      BACKEND: storages.backends.s3.S3Storage
      OPTIONS:
        bucket_name: ""
        # Full URL including scheme, e.g. https://s3.example.com. Also set this
        # for AWS itself (https://s3.<region>.amazonaws.com) — an empty value
        # would reach boto3 as an empty endpoint.
        endpoint_url: ""
        region_name: us-east-1
        file_overwrite: false
        # Ceph RGW and older Minio deployments need path-style addressing:
        # addressing_style: path

  ## The S3 credentials deliberately do not go into `storages.OPTIONS`: that
  ## whole block is rendered into the ConfigMap in cleartext. django-storages
  ## 1.14.6 (the version in NetBox 4.6) resolves AWS_ACCESS_KEY_ID and
  ## AWS_SECRET_ACCESS_KEY from the environment, so they come from the Secret.
  ## Web pods and worker pods both write attachments — keep the blocks in sync.
  extraEnvs: &s3Credentials
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: netbox-secrets
        key: s3_access_key
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: netbox-secrets
        key: s3_secret_key

  ## Single sign-on against Entra ID (Azure AD), through the social-auth backend
  ## that ships with NetBox. `remoteAuth.enabled` stays false on purpose — that
  ## switch turns on header-based authentication, which is a different thing.
  ##
  ## The client ID, client secret and tenant ID are not chart values: they are a
  ## `sso.yaml` key inside netbox-secrets, mounted as an extra config file, so
  ## the client secret never lands in a ConfigMap. See the README for the app
  ## registration and hack/create-netbox-secret.sh for the file's contents.
  ##
  ## NetBox appends its ObjectPermissionBackend, which extends Django's
  ## ModelBackend, so local login with the superuser keeps working alongside SSO.
  remoteAuth:
    enabled: false
    backends:
    - social_core.backends.azuread_tenant.AzureADTenantOAuth2
    autoCreateUser: true
    ## Groups every SSO user is put into on first login. They have to exist in
    ## NetBox already; the pipeline logs an error for names it cannot find.
    defaultGroups: []

  extraConfig:
  - secret:
      secretName: netbox-secrets
      items:
      - key: sso.yaml
        path: sso.yaml
      ## Optional so that a missing key does not leave the pods in
      ## ContainerCreating — SSO simply stays unconfigured, local login works.
      optional: true

  ## Cyberlink: enforce complete records for rack access devices.
  ## The class lives in the ConfigMap rendered by this chart and is mounted into
  ## the NetBox package directory below.
  customValidators:
    dcim.device:
    - netbox.cyberlink_validators.CustomDeviceValidator

  ## Validators run on every save, so the module has to be present in the web
  ## pods and in the worker pods alike. Keep both blocks in sync.
  extraVolumes:
  - name: custom-validators
    configMap:
      name: '{{ .Release.Name }}-custom-validators'
  extraVolumeMounts:
  - name: custom-validators
    mountPath: /opt/netbox/netbox/netbox/cyberlink_validators.py
    subPath: cyberlink_validators.py
    readOnly: true

  worker:
    ## Same S3 credentials as the web pods, see above.
    extraEnvs: *s3Credentials
    extraVolumes:
    - name: custom-validators
      configMap:
        name: '{{ .Release.Name }}-custom-validators'
    extraVolumeMounts:
    - name: custom-validators
      mountPath: /opt/netbox/netbox/netbox/cyberlink_validators.py
      subPath: cyberlink_validators.py
      readOnly: true

  ## Since NetBox 4.4 housekeeping runs through the built-in job scheduler, and
  ## the management command is deprecated as of 4.6, so the CronJob is redundant.
  housekeeping:
    enabled: false

  ## Left at the upstream default on purpose: the value is a list and therefore
  ## cannot be filled in from the Rancher form, and overriding it through
  ## `extraConfig` would break the probes, which talk to the pod IP whenever
  ## allowedHosts[0] is "*". The Ingress is what restricts the hostname.
  ## Set this in the YAML tab if you want NetBox to check the Host header too.
  allowedHosts:
  - "*"
