# Example configuration: replace the .example.com endpoints before deployment.
# Release: netbox | Namespace: netbox-dev
# Credentials belong in netbox-secrets in this namespace, never in this file.
hostname: netbox-dev.example.com
netbox:
  externalDatabase:
    host: pg.example.com
    database: netbox_dev
    username: netbox_dev
  storages:
    default:
      OPTIONS:
        bucket_name: netbox-dev
        endpoint_url: https://s3.example.com
  replicaCount: 1
  worker:
    replicaCount: 1
